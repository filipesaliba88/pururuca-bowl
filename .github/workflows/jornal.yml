name: Jornal semanal

on:
  schedule:
    # Todo dia às 13:00 UTC = 10:00 de Brasília.
    # A edição da rodada só sai na terça, porque só na terça existe rodada
    # fechada sem edição — nos outros dias o script não faz nada e não gasta
    # API. Rodar diariamente serve para duas coisas: pegar o draft no dia em
    # que ele fechar, e recuperar sozinho se a terça falhar.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      semana:
        description: "Forçar uma semana específica (deixe vazio para a última fechada)"
        required: false
        type: string
      force:
        description: "Regravar a edição mesmo se já existir"
        required: false
        type: boolean
        default: false
      league_id:
        description: "Liga alternativa (só para teste; vazio = liga atual)"
        required: false
        type: string
      previa:
        description: "Rodar a prévia da rodada (normalmente só às quintas)"
        required: false
        type: boolean
        default: false
      telegram:
        description: "Enviar no grupo do Telegram"
        required: false
        type: boolean
        default: true

# Necessário para o job commitar a edição de volta no repositório.
permissions:
  contents: write

concurrency:
  group: jornal
  cancel-in-progress: false

jobs:
  jornal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instala o SDK da Anthropic
        run: npm install --no-save --no-audit --no-fund @anthropic-ai/sdk

      - name: Que dia é hoje
        id: hoje
        run: echo "dia=$(date -u +%u)" >> "$GITHUB_OUTPUT"

      - name: Prévia da rodada, às quintas
        if: steps.hoje.outputs.dia == '4' || inputs.previa
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEMANA: ${{ inputs.semana }}
          FORCE: ${{ inputs.force && '1' || '' }}
          LEAGUE_ID: ${{ inputs.league_id }}
          SEM_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && !inputs.telegram && '1' || '' }}
        run: node scripts/jornal.mjs --previa

      - name: Atualiza o mapa de nomes que o site usa
        env:
          LEAGUE_ID: ${{ inputs.league_id }}
        run: node scripts/jornal.mjs --jogadores

      - name: Edição especial do draft, se ele tiver fechado
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LEAGUE_ID: ${{ inputs.league_id }}
          SEM_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && !inputs.telegram && '1' || '' }}
        run: node scripts/jornal.mjs --draft

      - name: Gera a edição da rodada
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEMANA: ${{ inputs.semana }}
          FORCE: ${{ inputs.force && '1' || '' }}
          LEAGUE_ID: ${{ inputs.league_id }}
          # No agendamento inputs.telegram é vazio, então o envio fica ligado.
          SEM_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && !inputs.telegram && '1' || '' }}
        run: node scripts/jornal.mjs

      - name: Commita a edição
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Nada novo para commitar."
            exit 0
          fi
          git config user.name "Seu Pururuca"
          git config user.email "actions@github.com"
          git add data
          git commit -m "Jornal: atualização de $(date -u +%d/%m/%Y)"
          git push
